name: kotlin-2026

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: kotlin_tasks
      POSTGRES_USER: kotlin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotlin -d kotlin_tasks"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
