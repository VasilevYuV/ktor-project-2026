name: kotlin-2026

services:
  app:
    image: kotlin-2026-app:local
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/kotlin_tasks
      DATABASE_USER: kotlin
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env or the shell}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the shell}
      JWT_ISSUER: ${JWT_ISSUER:-kotlin-task-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-kotlin-task-client}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  postgres:
    image: postgres:18.6-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792
    environment:
      POSTGRES_DB: kotlin_tasks
      POSTGRES_USER: kotlin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env or the shell}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotlin -d kotlin_tasks"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:
