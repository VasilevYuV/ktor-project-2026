[versions]
kotlin = "2.4.0"
logback = "1.5.37"
exposed = "1.6.0"
hikari = "7.0.2"
postgresql = "42.7.14"
testcontainers = "2.0.5"
bcrypt = "0.10.2"
swagger-ui = "5.34.0"
swagger-parser = "2.1.48"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
swagger-ui = { module = "org.webjars:swagger-ui", version.ref = "swagger-ui" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser-v3", version.ref = "swagger-parser" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
