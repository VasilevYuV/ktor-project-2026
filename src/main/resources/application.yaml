ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.vasilevyuv.application.ApplicationKt.module

database:
  url: "$DATABASE_URL:jdbc:postgresql://localhost:55432/kotlin_tasks"
  user: "$DATABASE_USER:kotlin"
  password: "$DATABASE_PASSWORD"
  poolSize: "$DATABASE_POOL_SIZE:5"

jwt:
  secret: "$JWT_SECRET"
  issuer: "$JWT_ISSUER:kotlin-task-api"
  audience: "$JWT_AUDIENCE:kotlin-task-client"
  expiresInSeconds: "$JWT_EXPIRES_IN_SECONDS:3600"

admin:
  login: "$ADMIN_LOGIN:"
  password: "$ADMIN_PASSWORD:"
